version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: haolu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DATABASE_DB:-node_forge_cms}
      MYSQL_USER: ${DATABASE_USERNAME:-node_forge_cms}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-changeme}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: haolu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  nginx:
    image: nginx:alpine
    container_name: haolu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haolu-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - mysql
      - redis

volumes:
  mysql_data:
